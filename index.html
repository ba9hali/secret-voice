<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONFIDENTIAL FILE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div id="boot">

            <p class="title">
                CONFIDENTIAL
            </p>

            <p id="line1"></p>
            <p id="line2"></p>
            <p id="line3"></p>
            <p id="line4"></p>
            <p id="line5"></p>

        </div>


        <button id="playBtn">
            ▶ PLAY CONFIDENTIAL FILE
            <span class="cursor">▌</span>
        </button>


        <div id="ending">

            <p>Session Terminated...</p>

            <div id="loading">

                <div id="loadingText">
                    Destroying Audio File...
                </div>

                <div id="progressBar">
                    <div id="progress"></div>
                </div>

                <div id="percent">
                    0%
                </div>

            </div>

            <h1 id="makima">
                خورشت ماکیما می‌خوری؟ 🍛
            </h1>

        </div>

    </div>


    <audio id="voice">
        <source src="voice.ogg" type="audio/ogg">
    </audio>


    <script src="script.js"></script>

</body>

</html>
